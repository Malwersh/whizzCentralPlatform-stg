<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حماية حساب الموظف</title><script src="../env.js"></script><script src="../config.js"></script><script src="https://sdk.amazonaws.com/js/aws-sdk-2.1544.0.min.js"></script><script src="../assets/js/auth-utils.js"></script><link rel="stylesheet" href="../styles/material-3-design-system.css"><style>main{max-width:700px;margin:auto;padding:24px}section{border:1px solid #ddd;border-radius:16px;padding:24px;margin:24px 0}label{display:block;margin:16px 0}input,button{font:inherit;padding:12px}input{max-width:95%}#secret{width:100%}</style></head><body><main><a href="staff.html">العودة إلى الموظفين</a><h1>حماية حساب الموظف</h1><p id="message" role="status" aria-live="polite"></p><section><h2>التحقق بخطوتين</h2><p>استخدم تطبيق تحقق على هاتفك مثل Google Authenticator أو Microsoft Authenticator. ستحتاج إلى رمزه عند تسجيل الدخول.</p><button id="activate" hidden>تفعيل حساب الموظف بعد إعداد التحقق</button><button id="start" disabled>إعداد تطبيق التحقق</button><form id="setup" hidden><p>أضف حسابًا جديدًا في تطبيق التحقق باستخدام مفتاح إعداد يدوي. لا تشارك المفتاح أو تصوره.</p><label>مفتاح الإعداد<input id="secret" readonly dir="ltr" autocomplete="off"></label><label>رمز التحقق<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button id="verify" type="submit">تفعيل التحقق بخطوتين</button></form></section></main><script src="../account-security.js?v=20261012-activation"></script></body></html>
