<h1>حماية حساب الموظف</h1>
<p id="message" role="status" aria-live="polite"></p>
<section><h2>التحقق بخطوتين</h2><p>استخدم تطبيق تحقق على هاتفك مثل Google Authenticator أو Microsoft Authenticator. ستحتاج إلى رمزه عند تسجيل الدخول.</p><button id="activate" hidden>تفعيل حساب الموظف بعد إعداد التحقق</button><button id="start" disabled>إعداد تطبيق التحقق</button><form id="setup" hidden><p>أضف حسابًا جديدًا في تطبيق التحقق باستخدام مفتاح إعداد يدوي. لا تشارك المفتاح أو تصوره.</p><label>مفتاح الإعداد<input id="secret" readonly dir="ltr" autocomplete="off"></label><label>رمز التحقق<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button id="verify" type="submit">تفعيل التحقق بخطوتين</button></form></section></main></div>
