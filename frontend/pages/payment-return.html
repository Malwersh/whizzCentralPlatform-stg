<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>العودة من الدفع التجريبي</title></head><body><main><h1>انتهت خطوة الدفع التجريبي</h1><p>عد إلى تطبيق السائق للتحقق من النتيجة. العودة إلى هذه الصفحة لا تؤكد نجاح الدفع؛ يتحقق الخادم من البوابة قبل إضافة رصيد الاختبار.</p><p>هذه عملية اختبار فقط ولا تؤثر في رصيد المحفظة الأساسي.</p></main></body></html>
