<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="./assets/js/wizz-locale.js?v=20261022-rtl1"></script>
    <link rel="stylesheet" href="./styles/arabic-font.css?v=20261022-rtl1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ويز سنترال — تسجيل الدخول</title>
    <script src="./env.js"></script>
    <script src="./config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #FDC500;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* Prevent brief login flash for already-authenticated users */
            visibility: hidden;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #FDC500;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #FDC500;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-size: 14px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .status.is-visible { display: block; }
        .btn-secondary { 
            width: 100%; 
            padding: 12px; 
            background: #6c757d; 
            color: #fff; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: transform .2s; 
        }
        .btn-secondary:hover { 
            transform: translateY(-2px); 
        }
        .mt-10 { 
            margin-top: 10px; 
        }
        .help-text { 
            color: #666; 
            font-size: 12px; 
            margin-top: 5px; 
            display: block; 
        }
        .hidden { display: none !important; }

        body { font-family: "Wizz Arabic", Tahoma, Arial, sans-serif; background: #f5f7fa; color: #19273d; line-height: 1.75; }
        .login-container { border: 1px solid #dfe5ed; border-top: 4px solid #f0c448; border-radius: 18px; box-shadow: 0 8px 32px #18273d0a; }
        h1 { color: #19273d; }
        input, button { font: inherit; min-height: 46px; border-radius: 8px; }
        input[type="email"], input[type="password"], #mfaCode { direction: ltr; text-align: left; }
        button { background: #233f69; color: #fff; font-weight: 600; }
        button:hover { transform: none; background: #1c3558; }
        .btn-secondary { background: #fff; color: #233f69; border: 1px solid #dfe5ed; }
        :is(button,input):focus-visible { outline: 3px solid #718fb8; outline-offset: 3px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>ويز سنترال</h1>
        <p class="subtitle">سجّل الدخول إلى حسابك</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required autocomplete="username" autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" id="loginBtn">تسجيل الدخول</button>
        </form>
        
        <!-- كلمة المرور الجديدة Form (hidden by default) -->
        <form id="newPasswordForm" class="hidden">
            <div class="form-group">
                <label for="newPassword">كلمة المرور الجديدة</label>
                <input type="password" id="newPassword" required placeholder="٨ أحرف على الأقل" autocomplete="new-password">
                <small class="help-text">
                    يجب أن تتضمن حرفاً كبيراً وحرفاً صغيراً ورقماً ورمزاً خاصاً
                </small>
            </div>
        
            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
                <input type="password" id="confirmPassword" required placeholder="أعد إدخال كلمة المرور الجديدة"
                    autocomplete="new-password">
            </div>
        
            <button type="submit" id="changePasswordBtn">تغيير كلمة المرور</button>
            <button type="button" id="cancelBtn" class="btn-secondary mt-10">إلغاء</button>
        </form>
        <form id="mfaForm" class="hidden" dir="rtl">
            <label for="mfaCode">رمز تطبيق التحقق</label>
            <input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
            <button id="mfaSubmit" type="submit">التحقق وتسجيل الدخول</button>
            <button id="mfaCancel" type="button" class="btn-secondary">إلغاء</button>
        </form>
        <div id="status" class="status"></div>
    </div>

    <!-- AWS SDK and Cognito -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="./assets/js/login.js?v=20261022-rtl1" defer></script>
</body>
</html>
