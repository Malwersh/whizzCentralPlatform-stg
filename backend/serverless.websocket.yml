service: wizzcentral-websocket
configValidationMode: error

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'staging'}
  websocketsApiName: WizzCentral-Chat-WebSocket-${self:provider.stage}
  websocketsApiRouteSelectionExpression: $request.body.action
  memorySize: 512
  timeout: 30
  environment:
    WEBSOCKET_CONNECTIONS_TABLE: websocket-connections-${self:provider.stage}
    WEBSOCKET_SUBSCRIPTIONS_TABLE: websocket-subscriptions-${self:provider.stage}
    CHAT_SESSIONS_TABLE: chat-sessions-${self:provider.stage}
    CHAT_MESSAGES_TABLE: chat-messages-${self:provider.stage}
    SUPPORT_BUSINESSES_TABLE: ${env:SUPPORT_BUSINESSES_TABLE, 'WhizzMerchants_Businesses'}
    SUPPORT_MEMBERSHIPS_TABLE: ${self:provider.stage}-MerchantPlatform
    SUPPORT_SETTINGS_TABLE: ${self:provider.stage}-PlatformStaff
    SUPPORT_LIFECYCLE_TABLE: ${self:provider.stage}-AccountDeletion
    SUPPORT_CUSTOMER_ORDERS_TABLE: ${env:SUPPORT_CUSTOMER_ORDERS_TABLE, 'WizzOrders'}
    SUPPORT_CUSTOMER_PROFILES_TABLE: ${env:SUPPORT_CUSTOMER_PROFILES_TABLE, 'WizzUser_users_staging'}
    SUPPORT_MESSAGE_RECEIPTS_TABLE: support-message-receipts-${self:provider.stage}
    SUPPORT_ATTACHMENTS_TABLE: support-attachments-${self:provider.stage}
    SUPPORT_ATTACHMENTS_BUCKET:
      Ref: SupportAttachmentsBucket
    SUPPORT_BUCKET_OWNER:
      Ref: AWS::AccountId
    SUPPORT_ALLOWED_ORIGIN: ${env:SUPPORT_ALLOWED_ORIGIN, ''}
    STAGE: ${self:provider.stage}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    # Optional auth config (pass via env at deploy time)
    CENTRAL_PLATFORM_USER_POOL_ID: ${env:CENTRAL_PLATFORM_USER_POOL_ID, ''}
    CENTRAL_PLATFORM_CLIENT_ID: ${env:CENTRAL_PLATFORM_CLIENT_ID, ''}
    MERCHANTS_USER_POOL_ID: ${env:MERCHANTS_USER_POOL_ID, ''}
    MERCHANTS_CLIENT_ID: ${env:MERCHANTS_CLIENT_ID, ''}
    DRIVERS_USER_POOL_ID: ${env:DRIVERS_USER_POOL_ID, ''}
    DRIVERS_CLIENT_ID: ${env:DRIVERS_CLIENT_ID, ''}
    CUSTOMERS_USER_POOL_ID: ${env:CUSTOMERS_USER_POOL_ID, ''}
    CUSTOMERS_CLIENT_ID: ${env:CUSTOMERS_CLIENT_ID, ''}
    COGNITO_REGION: ${env:COGNITO_REGION, 'us-east-1'}
    ORDERS_TABLE: ${env:ORDERS_TABLE, 'WizzOrders'}
    DRIVERS_TABLE: ${env:DRIVERS_TABLE, 'WhizzDrivers_staging'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:ConditionCheckItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/websocket-connections-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/websocket-connections-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/websocket-subscriptions-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/websocket-subscriptions-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/chat-sessions-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/chat-sessions-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/chat-messages-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/chat-messages-${self:provider.stage}/index/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:ConditionCheckItem
          Resource: arn:aws:dynamodb:${self:provider.region}:*:table/support-attachments-${self:provider.stage}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
          Resource: arn:aws:dynamodb:${self:provider.region}:*:table/support-message-receipts-${self:provider.stage}
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            Fn::Join:
              - ''
              - - Fn::GetAtt: [SupportAttachmentsBucket, Arn]
                - '/support-images/*'
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SUPPORT_CUSTOMER_ORDERS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SUPPORT_CUSTOMER_PROFILES_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SUPPORT_BUSINESSES_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SUPPORT_MEMBERSHIPS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SUPPORT_SETTINGS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SUPPORT_LIFECYCLE_TABLE}
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource: arn:aws:execute-api:${self:provider.region}:*:*/*/@connections/*

package:
  patterns:
    - '!**/*'
    - 'src/**'
    - 'node_modules/**'
    - '!wallet-service/**'
    - '!order-service/**'
    - '!**/.aws-sam/**'

functions:
  websocketConnect:
    handler: src/handlers/websocket-connections.handler
    timeout: 10
    events:
      - websocket:
          route: $connect
  websocketDisconnect:
    handler: src/handlers/websocket-connections.handler
    timeout: 6
    events:
      - websocket:
          route: $disconnect
  websocketDefault:
    handler: src/handlers/websocket-connections.handler
    timeout: 10
    events:
      - websocket:
          route: $default
  liveChatConnect:
    handler: src/handlers/websocket-connections.handler
    timeout: 12
    events:
      - websocket:
          route: chat_driver_connect
      - websocket:
          route: chat_agent_connect
      - websocket:
          route: chat_merchant_connect
  liveChatMessage:
    handler: src/handlers/websocket-connections.handler
    timeout: 12
    events:
      - websocket:
          route: chat_customer_connect
      - websocket:
          route: chat_message
      - websocket:
          route: chat_typing
      - websocket:
          route: chat_session_close
  supportAttachments:
    handler: src/handlers/support-attachments-handler.handler
    runtime: nodejs22.x
    timeout: 20
    events:
      - http:
          path: /support/attachments
          method: post
      - http:
          path: /support/attachments
          method: get
      - http:
          path: /support/attachments
          method: options
  chatBridge:
    handler: src/handlers/chat-bridge.sendChatMessage
    timeout: 29
    events:
      - http:
          path: /chat/send
          method: post
          cors: true

resources:
  Resources:
    SupportMessageReceiptsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: support-message-receipts-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: receiptId
            AttributeType: S
        KeySchema:
          - AttributeName: receiptId
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    SupportAttachmentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: support-attachments-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: attachmentId
            AttributeType: S
        KeySchema:
          - AttributeName: attachmentId
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    SupportAttachmentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: ExpireSupportImages
              Status: Enabled
              ExpirationInDays: 30
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1
    SupportAttachmentsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: SupportAttachmentsBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Deny
              Principal: '*'
              Action: s3:*
              Resource:
                - Fn::GetAtt: [SupportAttachmentsBucket, Arn]
                - Fn::Join: ['', [{Fn::GetAtt: [SupportAttachmentsBucket, Arn]}, '/*']]
              Condition:
                Bool:
                  aws:SecureTransport: false
    WebSocketConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: websocket-connections-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: userType
            AttributeType: S
          - AttributeName: businessId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserTypeIndex
            KeySchema:
              - AttributeName: userType
                KeyType: HASH
              - AttributeName: userId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: BusinessIdIndex
            KeySchema:
              - AttributeName: businessId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    WebSocketSubscriptionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: websocket-subscriptions-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: subscriptionId
            AttributeType: S
        KeySchema:
          - AttributeName: subscriptionId
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    ChatSessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: chat-sessions-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: driverId
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: DriverIdIndex
            KeySchema:
              - AttributeName: driverId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    ChatMessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: chat-messages-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: messageKey
            AttributeType: S
          - AttributeName: senderType
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
          - AttributeName: messageKey
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: SenderIndex
            KeySchema:
              - AttributeName: senderType
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

plugins: []