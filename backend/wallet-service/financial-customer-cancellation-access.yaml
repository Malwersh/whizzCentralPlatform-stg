AWSTemplateFormatVersion: '2010-09-09'
Description: Supplemental access for the existing staging customer cancellation execution role. Does not enable the feature.
Parameters:
  CustomerCancellationRoleName:
    Type: String
Resources:
  CustomerCancellationAccess:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles: [!Ref CustomerCancellationRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzUser_users_staging
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-AccountDeletion
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzOrders
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:ConditionCheckItem]
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-WizzOfferJourney
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Discounts
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_Platform_Discounts
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-WalletLifecycle
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzDispatchJobs_staging
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-Holds
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:ConditionCheckItem]
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-PlatformStaff
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: ['DELIVERY_RESERVATION#*', 'DELIVERY_BUDGET#*', 'DELIVERY_USAGE#*']
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-Wallets
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys: ['WALLET#PLATFORM']
          - Effect: Allow
            Action: [dynamodb:PutItem]
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-LedgerEntries
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys: ['WALLET#PLATFORM']
          - Effect: Allow
            Action: [dynamodb:PutItem]
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-AuditLog
