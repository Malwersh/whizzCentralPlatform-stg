  WalletServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-wizz-wallet-service
      CodeUri: ./
      Handler: dist/index.handler
      Description: Centralized wallet service for Wizz platform
      Environment:
        Variables:
          PLATFORM_ENVIRONMENT: !Ref Environment
          PLATFORM_WRITE_MODE: !Ref PlatformWriteMode
          PLATFORM_DIRECT_OPERATOR_IDS: !Ref PlatformDirectOperatorIds
          WALLET_NOTIFICATIONS_TABLE: !Ref WalletNotificationsTable
          WALLET_LIFECYCLE_TABLE: !If [IsSandboxStaging, !Ref WalletLifecycleTable, '']
          ORDERS_TABLE: !If [IsSandboxStaging, 'WizzOrders', '']
          ENVIRONMENT: !Ref Environment
          ACCOUNT_DELETION_TABLE: !If [IsSandboxStaging, 'staging-AccountDeletion', '']
          STAFF_TABLE: !If [IsSandboxStaging, 'staging-PlatformStaff', '']
          TRANSFER_OTP_SECRET_ARN: !If [IsSandboxStaging, 'arn:aws:secretsmanager:us-east-1:699561669180:secret:wizz/staging/otpiq-SB1iGZ', '']
          CUSTOMER_USER_POOL_ID: !If [IsSandboxStaging, 'us-east-1_TpyyrVkEE', '']
          MERCHANT_USER_POOL_ID: !If [IsSandboxStaging, 'us-east-1_gtCR3ndzT', '']
          MERCHANTS_TABLE: !If [IsSandboxStaging, 'WhizzMerchants_Businesses', '']
          DRIVERS_TABLE: !If [IsSandboxStaging, 'WhizzDrivers_staging', '']
          SANDBOX_PAYMENTS_TABLE: !If [IsSandboxStaging, !Ref SandboxPaymentsTable, '']
          SANDBOX_RETURN_URL: !If [IsSandboxStaging, 'https://staging.d2vmebm1e1n95m.amplifyapp.com/pages/payment-return.html', '']
          SANDBOX_QI_WEBHOOK_URL: !If [IsSandboxStaging, 'https://z14s5f8oxh.execute-api.us-east-1.amazonaws.com/staging/wallet/funding/sandbox/notification', '']
          FUNDING_RECEIPTS_BUCKET: !Ref FundingReceiptsBucket
          WALLETS_TABLE: !Ref WalletsTableName
          LEDGER_TABLE: !Ref LedgerTableName
          HOLDS_TABLE: !Ref HoldsTableName
          TOPUP_REQUESTS_TABLE: !Ref TopupRequestsTableName
          AUDIT_LOG_TABLE: !Ref AuditLogTableName
          IDEMPOTENCY_KEYS_TABLE: !Ref IdempotencyKeysTableName
      Policies:
        - !If
          - IsSandboxStaging
          - Statement:
              Effect: Allow
              Action: [dynamodb:ConditionCheckItem, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-AccountDeletion
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['ACCOUNT_LIFECYCLE#DRIVER#*', 'ACCOUNT_LIFECYCLE#MERCHANT#*', 'BUSINESS_LIFECYCLE#MERCHANT#*', 'MEMBERSHIP_LIFECYCLE#MERCHANT#*', 'ACCOUNT_OPERATION#DRIVER#*']
          - !Ref AWS::NoValue
        - !If
          - IsSandboxStaging
          - Statement:
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: arn:aws:secretsmanager:us-east-1:699561669180:secret:wizz/staging/otpiq-SB1iGZ
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:ConditionCheckItem]
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses
            - Effect: Allow
              Action: [cognito-idp:ListUsers]
              Resource:
                - !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/us-east-1_TpyyrVkEE
                - !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/us-east-1_gtCR3ndzT
        - !If
          - IsSandboxStaging
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt WalletLifecycleTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzOrders
              - Effect: Allow
                Action: [dynamodb:Scan]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzDrivers_staging
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-PlatformStaff
          - !Ref AWS::NoValue
        - !If
          - IsSandboxStaging
          - DynamoDBCrudPolicy:
              TableName: !Ref SandboxPaymentsTable
          - !Ref AWS::NoValue
        - !If
          - IsSandboxStaging
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wizz/staging/payments/*/sandbox-*'
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref WalletNotificationsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub '${FundingReceiptsBucket.Arn}/receipts/*'
        - DynamoDBCrudPolicy:
            TableName: !Ref WalletsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref LedgerTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref HoldsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref TopupRequestsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyKeysTableName
      Events:
        WalletLifecycleRetry:
          Type: Api
          Properties:
            Path: /wallet/funding/admin/lifecycle/retry
            Method: post
            RestApiId: !Ref WalletServiceApi
            Auth:
              Authorizer: WalletAuthorizer
        WalletLifecycleRead:
          Type: Api
          Properties:
            Path: /wallet/funding/admin/lifecycle
            Method: get
            RestApiId: !Ref WalletServiceApi
            Auth:
              Authorizer: WalletAuthorizer
        FinancialOwners:
          Type: Api
          Properties:
            Path: /wallet/funding/admin/owners
            Method: GET
            RestApiId: !Ref WalletServiceApi
            Auth:
              Authorizer: WalletAuthorizer
        WalletNotificationsInbox:
          Type: Api
          Properties:
            Path: /wallet/me/notifications
            Method: GET
            RestApiId: !Ref WalletServiceApi
            Auth:
              Authorizer: WalletAuthorizer
        TransferSettingsCancel:
          Type: Api
