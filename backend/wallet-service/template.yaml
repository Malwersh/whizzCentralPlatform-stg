AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wizz Wallet Service - Centralized wallet management for drivers, merchants, and platform

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

Parameters:
  PlatformWriteMode:
    Type: String
    Default: REVIEW
    AllowedValues: [REVIEW, DIRECT]
  PlatformDirectOperatorIds:
    Type: String
    Default: ''

  MerchantStaffPermissionMode:
    Type: String
    Default: CENTRAL
    AllowedValues: [CENTRAL]
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production
    Description: Deployment environment

  WalletsTableName:
    Type: String
    Default: dev-Wallets
    Description: DynamoDB table name for wallets

  LedgerTableName:
    Type: String
    Default: dev-LedgerEntries
    Description: DynamoDB table name for ledger entries

  HoldsTableName:
    Type: String
    Default: dev-Holds
    Description: DynamoDB table name for holds

  TopupRequestsTableName:
    Type: String
    Default: dev-TopupRequests
    Description: DynamoDB table name for topup requests

  AuditLogTableName:
    Type: String
    Default: dev-AuditLog
    Description: DynamoDB table name for audit logs

  IdempotencyKeysTableName:
    Type: String
    Default: dev-IdempotencyKeys
    Description: DynamoDB table name for idempotency keys

  DriverCognitoUserPoolId:
    Type: String
    Default: 'us-east-1_Mnrmklxro'
    Description: Cognito User Pool for Drivers (hadhir-phone-only-pool - phone-based auth)

  AdminCognitoUserPoolId:
    Type: String
    Default: 'us-east-1_Cp9YnOQWi'
    Description: Cognito User Pool for Admins (wizzcentral - email-based auth)

  ServiceCognitoUserPoolId:
    Type: String
    Default: 'us-east-1_8LyVWuZnO'
    Description: Cognito User Pool for Service Accounts (wizz-wallet-service-pool)

Conditions:
  IsSandboxStaging: !Equals [!Ref Environment, staging]

Resources:
  WalletLifecycleTable:
    Type: AWS::DynamoDB::Table
    Condition: IsSandboxStaging
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: staging-WalletLifecycle
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: operationId
          AttributeType: S
        - AttributeName: queuePartition
          AttributeType: S
        - AttributeName: nextAttemptAt
          AttributeType: N
      GlobalSecondaryIndexes:
        - IndexName: ByDue
          KeySchema:
            - AttributeName: queuePartition
              KeyType: HASH
            - AttributeName: nextAttemptAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      KeySchema:
        - AttributeName: operationId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  # COD writer/integration and extra legacy guard policies are owned by cod-lifecycle.staging.json.
  WalletLifecycleWorker:
    Type: AWS::Serverless::Function
    Condition: IsSandboxStaging
    Properties:
      FunctionName: staging-wizz-wallet-lifecycle
      CodeUri: ./
      Handler: dist/index.walletLifecycleWorker
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
              Resource:
                - !GetAtt WalletLifecycleTable.Arn
                - !Sub '${WalletLifecycleTable.Arn}/index/ByDue'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WalletsTableName}
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan, dynamodb:UpdateItem]
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HoldsTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HoldsTableName}/index/*
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LedgerTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditLogTableName}
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzOrders
      Environment:
        Variables:
          WALLET_LIFECYCLE_TABLE: !Ref WalletLifecycleTable
          ORDERS_TABLE: WizzOrders
          WALLETS_TABLE: !Ref WalletsTableName
          HOLDS_TABLE: !Ref HoldsTableName
          LEDGER_TABLE: !Ref LedgerTableName
          AUDIT_LOG_TABLE: !Ref AuditLogTableName
          IDEMPOTENCY_KEYS_TABLE: !Ref IdempotencyKeysTableName
      Events:
        RetryLifecycle:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
  FundingReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # Cognito Post-Confirmation Trigger Lambda
  WalletCreationTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-wizz-wallet-creation-trigger
      CodeUri: ./
      Handler: dist/cognitoTrigger.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Description: Cognito trigger to create wallet for new drivers
      Environment:
        Variables:
          WALLET_API_URL: !Sub https://${WalletServiceApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
      Policies:
        - Version: '2012-10-17'
          Statement:
            # Allow Lambda to invoke Wallet Service API using IAM auth
            - Effect: Allow
              Action:
                - 'execute-api:Invoke'
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WalletServiceApi}/${Environment}/POST/wallet/create'

  # Permission for Cognito to invoke the trigger
  WalletCreationTriggerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt WalletCreationTriggerFunction.Arn
      Action: 'lambda:InvokeFunction'
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${DriverCognitoUserPoolId}'


  # Lambda Authorizer Function
  SandboxPaymentsTable:
    Condition: IsSandboxStaging
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-SandboxPayments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  WalletNotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-WalletNotifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: eventId, AttributeType: S}
        - {AttributeName: driverId, AttributeType: S}
        - {AttributeName: createdAt, AttributeType: S}
        - {AttributeName: deliveryStatus, AttributeType: S}
        - {AttributeName: nextAttemptAt, AttributeType: N}
      KeySchema:
        - {AttributeName: eventId, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: ByDriver
          KeySchema:
            - {AttributeName: driverId, KeyType: HASH}
            - {AttributeName: createdAt, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: PendingDelivery
          KeySchema:
            - {AttributeName: deliveryStatus, KeyType: HASH}
            - {AttributeName: nextAttemptAt, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      StreamSpecification: {StreamViewType: NEW_IMAGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  WalletNotificationWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-wizz-wallet-notification-worker
      CodeUri: notification-worker/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          WALLET_NOTIFICATIONS_TABLE: !Ref WalletNotificationsTable
          PUSH_TOKENS_TABLE: !Sub WizzCentral_PushDeviceTokens_${Environment}
          FIREBASE_ADMIN_SA_SECRET_ID: !Sub wizz/${Environment}/firebase/admin-service-account
          STAGE: !Ref Environment
          FINANCIAL_COD_ACCOUNT_ID: !Ref AWS::AccountId
          FINANCIAL_COD_NOTIFICATIONS_MODE: 'OFF'
          DISPATCH_RESPONSE_NOTIFICATIONS_MODE: 'OFF'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WalletNotificationsTable
        - !If
          - IsSandboxStaging
          - Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzDrivers_staging
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-AccountDeletion
                Condition:
                  'Null':
                    dynamodb:Attributes: 'false'
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: [pk, sk, driverId, cognitoSub, isDeleted, deletedAt, deletionRequestId]
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:DeleteItem]
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_PushDeviceTokens_${Environment}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_PushDeviceTokens_${Environment}/index/SubjectIdIndex
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wizz/${Environment}/firebase/admin-service-account-*
      Events:
        WalletOutboxStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt WalletNotificationsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            MaximumRetryAttempts: 3
            FunctionResponseTypes: [ReportBatchItemFailures]
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"]}'
        RetryPending:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  WalletAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-wizz-wallet-authorizer
      CodeUri: authorizer_lambda/
      Handler: authorizer.lambda_handler
      Runtime: python3.9
      Timeout: 10
      MemorySize: 256
      Description: Custom authorizer for Wallet Service - validates Cognito tokens and enforces RBAC
      Environment:
        Variables:
          PLATFORM_ENVIRONMENT: !Ref Environment
          PLATFORM_WRITE_MODE: !Ref PlatformWriteMode
          PLATFORM_DIRECT_OPERATOR_IDS: !Ref PlatformDirectOperatorIds
          MERCHANT_DEVICE_AUTHORIZER_FUNCTION: !If [IsSandboxStaging, !GetAtt MerchantDeviceWalletFunction.Arn, '']
          MERCHANT_DEVICE_FINANCE_AUTHORIZER_FUNCTION: !If [IsSandboxStaging, !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-merchant-device-transfers', '']
          DRIVER_USER_POOL_ID: !Ref DriverCognitoUserPoolId
          ADMIN_USER_POOL_ID: !Ref AdminCognitoUserPoolId
          SERVICE_USER_POOL_ID: !Ref ServiceCognitoUserPoolId
          REGION: !Ref AWS::Region
          CUSTOMER_USER_POOL_ID: !If [IsSandboxStaging, 'us-east-1_TpyyrVkEE', '']
          MERCHANT_USER_POOL_ID: !If [IsSandboxStaging, 'us-east-1_gtCR3ndzT', '']
          CUSTOMER_CLIENT_ID: !If [IsSandboxStaging, '4a9e8o3em311eq2rgckp0pd2s9', '']
          MERCHANT_CLIENT_ID: !If [IsSandboxStaging, '4qabvh11nmghmf9fmc6e6ludd2', '']
          DRIVER_CLIENT_ID: !If [IsSandboxStaging, '2d26d3muq0vvcuf42lkpgmkgsr', '']
          ADMIN_CLIENT_ID: !If [IsSandboxStaging, '17mu2qlqis0qcs1n1n980q7e3j', '']
          STAFF_TABLE: !If [IsSandboxStaging, 'staging-PlatformStaff', '']
      Policies:
        - !If
          - IsSandboxStaging
          - Statement:
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: [!GetAtt MerchantDeviceWalletFunction.Arn, !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-merchant-device-transfers']
          - !Ref AWS::NoValue
        - !If
          - IsSandboxStaging
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-PlatformStaff
              - Effect: Allow
                Action: [cognito-idp:AdminGetUser]
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${AdminCognitoUserPoolId}
          - !Ref AWS::NoValue
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV2:68

  # Lambda Function
  # Staging-only reader: no permission to create wallets or move funds.
  MerchantDeviceWalletFunction:
    Type: AWS::Serverless::Function
    Condition: IsSandboxStaging
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub ${Environment}-merchant-device-wallet-read
      CodeUri: ./
      Handler: dist/merchantDeviceWallet.handler
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          MERCHANT_STAFF_PERMISSION_MODE: !Ref MerchantStaffPermissionMode
          WALLETS_TABLE: !Ref WalletsTableName
          LEDGER_TABLE: !Ref LedgerTableName
          AUDIT_LOG_TABLE: !Ref AuditLogTableName
      Role: !GetAtt MerchantDeviceWalletRole.Arn

  # Imported release74 role: keep its physical name and explicit inline policy.
  MerchantDeviceWalletRole:
    Type: AWS::IAM::Role
    Condition: IsSandboxStaging
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: staging-merchant-device-wallet-read-role
      Path: /
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MerchantDeviceReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WalletsTableName}
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['WALLET#MERCHANT#*']
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzOrders
                Condition:
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: [PK, SK, businessId, storeId, merchantId, createdAt, status, currency, pricing, total, subtotal, createdBy, financialSnapshot]
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LedgerTableName}
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['WALLET#MERCHANT#*']
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-MerchantPlatform
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['BRANCH#*']
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditLogTableName}
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['date#*']
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-MerchantPlatform
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['BRANCH#*']
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: ["pk", "sk", "businessId", "ownerId", "cognitoUserId", "subjectId", "membershipId", "displayName", "role", "status", "version", "permissionSchema", "extraPermissions", "grant", "deviceId", "deviceVersion", "sessionId", "membershipVersion", "pinVersion", "tokenHash", "expiresAt", "deletionRequestId"]
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
              - Effect: Allow
                Action: dynamodb:ConditionCheckItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-MerchantPlatform
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['BRANCH#*']
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-AccountDeletion
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['BUSINESS_LIFECYCLE#MERCHANT#*', 'ACCOUNT_LIFECYCLE#MERCHANT#*']
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-PlatformStaff
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: ['OPERATIONAL_SETTINGS#MERCHANT_STAFF_PERMISSIONS']
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/staging-merchant-device-wallet-read:*

  MerchantDeviceApiWalletBranchDeviceTransactions:
    Type: AWS::ApiGateway::Resource
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId:
        Ref: WalletServiceApi
      ParentId:
        Ref: MerchantDeviceApiWalletBranchDevice
      PathPart: transactions
    Condition: IsSandboxStaging
  MerchantDeviceApiWalletBranchDeviceTransactionsGET:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId:
        Ref: WalletServiceApi
      ResourceId:
        Ref: MerchantDeviceApiWalletBranchDeviceTransactions
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: 2bqq12
      ApiKeyRequired: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:699561669180:function:staging-merchant-device-wallet-read/invocations
        PassthroughBehavior: WHEN_NO_MATCH
        TimeoutInMillis: 29000
        CacheNamespace: 5yyq0m
        CacheKeyParameters: []
    Condition: IsSandboxStaging
  MerchantDeviceApiWalletBranchDeviceTransactionsOPTIONS:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId:
        Ref: WalletServiceApi
      ResourceId:
        Ref: MerchantDeviceApiWalletBranchDeviceTransactions
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      MethodResponses:
      - StatusCode: '200'
        ResponseParameters:
          method.response.header.Access-Control-Allow-Headers: true
          method.response.header.Access-Control-Allow-Methods: true
          method.response.header.Access-Control-Allow-Origin: true
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode":200}'
        PassthroughBehavior: WHEN_NO_MATCH
        TimeoutInMillis: 29000
        CacheNamespace: 5yyq0m
        CacheKeyParameters: []
        IntegrationResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Staff-Session'''
            method.response.header.Access-Control-Allow-Methods: '''GET,OPTIONS'''
            method.response.header.Access-Control-Allow-Origin: '''*'''
    Condition: IsSandboxStaging
  MerchantDeviceApiWalletBranchDeviceBalance:
    Type: AWS::ApiGateway::Resource
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId:
        Ref: WalletServiceApi
      ParentId:
        Ref: MerchantDeviceApiWalletBranchDevice
      PathPart: balance
    Condition: IsSandboxStaging
  MerchantDeviceApiWalletBranchDeviceBalanceGET:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId:
        Ref: WalletServiceApi
      ResourceId:
        Ref: MerchantDeviceApiWalletBranchDeviceBalance
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: 2bqq12
      ApiKeyRequired: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:699561669180:function:staging-merchant-device-wallet-read/invocations
        PassthroughBehavior: WHEN_NO_MATCH
        TimeoutInMillis: 29000
        CacheNamespace: 7fl7me
        CacheKeyParameters: []
    Condition: IsSandboxStaging
  MerchantDeviceApiWalletBranchDeviceBalanceOPTIONS:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId:
        Ref: WalletServiceApi
      ResourceId:
        Ref: MerchantDeviceApiWalletBranchDeviceBalance
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      MethodResponses:
      - StatusCode: '200'
        ResponseParameters:
          method.response.header.Access-Control-Allow-Headers: true
          method.response.header.Access-Control-Allow-Methods: true
          method.response.header.Access-Control-Allow-Origin: true
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode":200}'
        PassthroughBehavior: WHEN_NO_MATCH
        TimeoutInMillis: 29000
        CacheNamespace: 7fl7me
        CacheKeyParameters: []
        IntegrationResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Staff-Session'''
            method.response.header.Access-Control-Allow-Methods: '''GET,OPTIONS'''
            method.response.header.Access-Control-Allow-Origin: '''*'''
    Condition: IsSandboxStaging
  MerchantDeviceApiWalletBranchDeviceStatement:
    Type: AWS::ApiGateway::Resource
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId:
        Ref: WalletServiceApi
      ParentId:
        Ref: MerchantDeviceApiWalletBranchDevice
      PathPart: statement
    Condition: IsSandboxStaging
  MerchantDeviceApiWalletBranchDeviceStatementGET:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId:
        Ref: WalletServiceApi
      ResourceId:
        Ref: MerchantDeviceApiWalletBranchDeviceStatement
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: 2bqq12
      ApiKeyRequired: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:699561669180:function:staging-merchant-device-wallet-read/invocations
        PassthroughBehavior: WHEN_NO_MATCH
        TimeoutInMillis: 29000
        CacheNamespace: ms12eb
        CacheKeyParameters: []
    Condition: IsSandboxStaging
  MerchantDeviceApiWalletBranchDeviceStatementOPTIONS:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
