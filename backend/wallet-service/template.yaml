  # API Gateway
  WalletServiceApi:
    Type: AWS::Serverless::Api
    Properties:
      # Explicit imported device resources share this API with the existing SAM routes.
      # Merge preserves those routes during a reviewed future OpenAPI update.
      Name: !Sub ${Environment}-wizz-wallet-api
      Mode: merge
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Staff-Session,X-Api-Key,X-Amz-Security-Token,X-Amz-Content-Sha256,x-trigger-secret'"
        AllowOrigin: "'*'"
      GatewayResponses:
        UNAUTHORIZED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Staff-Session'"
        ACCESS_DENIED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Staff-Session'"
        AUTHORIZER_FAILURE:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Staff-Session'"
        AUTHORIZER_CONFIGURATION_ERROR:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Staff-Session'"
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Staff-Session'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Staff-Session'"
      Auth:
        Authorizers:
          # Custom Lambda Authorizer - validates Cognito tokens and enforces RBAC
          WalletAuthorizer:
            FunctionArn: !GetAtt WalletAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - Authorization
              ReauthorizeEvery: 0  # Disable caching - always validate RBAC

  # CloudWatch Log Group
  WalletServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-wizz-wallet-service
      RetentionInDays: 14

  # IAM Role for Lambda
  WalletServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-wizz-wallet-service-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                  - dynamodb:TransactGetItems
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WalletsTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WalletsTableName}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LedgerTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LedgerTableName}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HoldsTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HoldsTableName}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TopupRequestsTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TopupRequestsTableName}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditLogTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditLogTableName}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IdempotencyKeysTableName}

  # API Gateway CloudWatch Role
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

Outputs:
  WalletServiceApi:
    Description: API Gateway endpoint URL for Wallet Service
    Value: !Sub https://${WalletServiceApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
    Export:
      Name: !Sub ${Environment}-WalletServiceApiUrl

  WalletServiceFunction:
    Description: Wallet Service Lambda Function ARN
    Value: !GetAtt WalletServiceFunction.Arn
    Export:
      Name: !Sub ${Environment}-WalletServiceFunctionArn

  WalletServiceFunctionName:
    Description: Wallet Service Lambda Function Name
    Value: !Ref WalletServiceFunction
    Export:
      Name: !Sub ${Environment}-WalletServiceFunctionName

  ApiId:
    Description: API Gateway ID
    Value: !Ref WalletServiceApi
    Export:
      Name: !Sub ${Environment}-WalletServiceApiId

  WalletCreationTriggerFunctionArn:
    Description: Wallet Creation Trigger Lambda Function ARN
    Value: !GetAtt WalletCreationTriggerFunction.Arn
    Export:
      Name: !Sub ${Environment}-WalletCreationTriggerFunctionArn

  WalletCreationTriggerFunctionName:
    Description: Wallet Creation Trigger Lambda Function Name
    Value: !Ref WalletCreationTriggerFunction
    Export:
      Name: !Sub ${Environment}-WalletCreationTriggerFunctionName
