<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ويز — حماية حساب الإدارة</title><link rel="stylesheet" href="/portal.css"><script src="/config.js"></script><script src="/vendor/aws-sdk.min.js"></script><script src="/assets/js/auth-utils.js"></script><script src="/account-security.js" defer></script></head><body><main><header><h1>حماية حساب الإدارة</h1><a href="/pages/dashboard.html">العودة</a></header><p id="message" role="status" aria-live="polite">جارٍ التحقق من حماية الحساب…</p><section><h2>التحقق بخطوتين</h2><p>استخدم تطبيق تحقق على هاتفك. ستحتاج إلى رمزه عند تسجيل الدخول.</p><button id="activate" hidden>إكمال تفعيل الحساب</button><button id="start" disabled>إعداد تطبيق التحقق</button><form id="setup" hidden><p>أضف الحساب في تطبيق التحقق باستخدام مفتاح الإعداد. احتفظ به لنفسك.</p><label>مفتاح الإعداد<input id="secret" readonly dir="ltr" autocomplete="off"></label><label>رمز التحقق<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button id="verify" type="submit">تفعيل التحقق بخطوتين</button></form></section></main></body></html>
